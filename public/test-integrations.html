<head>
  <meta charset="utf-8">
  <title>Integration OG Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f0f0f0; padding: 24px; }
    h1 { margin-bottom: 24px; }
    .grid { display: flex; flex-wrap: wrap; gap: 16px; }
    .card { width: 600px; }
    .card img { width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card a { display: block; margin-top: 4px; font-size: 13px; color: #666; text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .controls { margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
    .controls label { font-size: 14px; cursor: pointer; user-select: none; }
  </style>
</head>
<body>
  <h1>Integration OG Images (1461)</h1>
  <div class="controls">
    <input type="checkbox" id="bypass-cache">
    <label for="bypass-cache">Bypass cache (append cache-busting param)</label>
  </div>
  <div class="grid">
  <script>
    document.getElementById("bypass-cache").addEventListener("change", (e) => {
      const imgs = document.querySelectorAll(".card img");
      imgs.forEach((img) => {
        const base = img.src.replace(/&_cb=\d+/, "");
        img.src = e.target.checked ? base + "&_cb=" + Date.now() : base;
      });
    });
  </script>
