<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OG Image Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Figtree, sans-serif; background: #f0f0f0; padding: 40px; }
    h1 { margin-bottom: 8px; }
    h2.section { font-size: 16px; color: #666; margin-bottom: 24px; }
    .tabs { display: flex; gap: 0; margin-bottom: 24px; }
    .tab { padding: 8px 20px; font-size: 14px; font-weight: 700; border: 1px solid #ccc; background: #fff; cursor: pointer; font-family: inherit; }
    .tab:first-child { border-radius: 6px 0 0 6px; }
    .tab:last-child { border-radius: 0 6px 6px 0; }
    .tab.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
    .mode { display: none; }
    .mode.active { display: block; }
    .form { margin-bottom: 40px; display: flex; gap: 16px; flex-wrap: wrap; align-items: end; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 14px; font-weight: 700; }
    .field input, .field select { padding: 8px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; width: 400px; font-family: inherit; }
    .btn { padding: 8px 20px; font-size: 16px; font-weight: 700; border: none; border-radius: 6px; background: #1a1a2e; color: #fff; cursor: pointer; font-family: inherit; }
    .btn:hover { background: #2a2a4e; }
    .previews { display: flex; flex-direction: column; gap: 32px; }
    .preview { display: flex; flex-direction: column; gap: 8px; }
    .preview h2 { font-size: 18px; color: #666; }
    .preview h2 span { font-weight: 400; font-size: 14px; color: #999; }
    .preview img { border: 1px solid #ddd; background: #fff; }
    .options { margin-bottom: 24px; font-size: 14px; display: flex; gap: 16px; }
    .options label { cursor: pointer; }
    .status { font-size: 14px; color: #888; margin-bottom: 16px; min-height: 20px; }
    .debug-panel { background: #1a1a2e; color: #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 24px; font-size: 13px; font-family: monospace; display: none; }
    .debug-panel.visible { display: block; }
    .debug-panel h3 { font-family: Figtree, sans-serif; font-size: 14px; color: #fff; margin-bottom: 12px; }
    .debug-steps { list-style: none; padding: 0; margin: 0 0 16px 0; }
    .debug-steps li { padding: 4px 0; border-bottom: 1px solid #2a2a4e; }
    .debug-steps li:last-child { border-bottom: none; }
    .debug-steps .step-num { color: #666; margin-right: 8px; }
    .debug-result { display: flex; gap: 24px; flex-wrap: wrap; }
    .debug-result dt { color: #888; font-size: 12px; text-transform: uppercase; margin-bottom: 2px; }
    .debug-result dd { color: #fff; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>OG Image Generator</h1>
  <h2 class="section">Preview OG images with manual input or by fetching from a URL</h2>

  <div class="tabs">
    <button class="tab active" data-mode="manual">Manual</button>
    <button class="tab" data-mode="url">From URL</button>
  </div>

  <div id="mode-manual" class="mode active">
    <div class="form">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" value="Hello, Open Home Foundation!" />
      </div>
      <div class="field">
        <label for="subtitle">Subtitle</label>
        <input type="text" id="subtitle" value="This is a test OG image" />
      </div>
      <div class="field">
        <label for="category">Category</label>
        <input type="text" id="category" placeholder="Optional" />
      </div>
      <div class="field">
        <label for="author">Author</label>
        <input type="text" id="author" placeholder="Optional" />
      </div>
      <div class="field">
        <label for="template">Template</label>
        <select id="template"></select>
      </div>
      <div class="field">
        <label for="layout">Layout</label>
        <select id="layout"></select>
      </div>
    </div>
  </div>

  <div id="mode-url" class="mode">
    <div class="form">
      <div class="field">
        <label for="url">Website URL</label>
        <input type="url" id="url" placeholder="https://example.com" />
      </div>
      <button class="btn" id="fetch-btn">Fetch</button>
    </div>
    <div class="status" id="status"></div>
    <div class="debug-panel" id="debug-panel">
      <h3>Template Resolution</h3>
      <ol class="debug-steps" id="debug-steps"></ol>
      <div class="debug-result" id="debug-result"></div>
    </div>
  </div>

  <div class="options">
    <label><input type="checkbox" id="bypass-cache" checked /> Bypass cache</label>
    <label><input type="checkbox" id="ignore-og" checked /> Ignore existing OG image</label>
  </div>

  <div class="previews">
    <div class="preview">
      <h2>OG Image (1200 x 630) <span id="time-og"></span></h2>
      <img id="img-og" width="600" />
    </div>
    <div class="preview">
      <h2>Portrait (1080 x 1350) <span id="time-portrait"></span></h2>
      <img id="img-portrait" width="400" />
    </div>
    <div class="preview">
      <h2>Square (1080 x 1080) <span id="time-square"></span></h2>
      <img id="img-square" width="400" />
    </div>
  </div>

  <script>
    const titleInput = document.getElementById("title");
    const subtitleInput = document.getElementById("subtitle");
    const categoryInput = document.getElementById("category");
    const authorInput = document.getElementById("author");
    const urlInput = document.getElementById("url");
    const fetchBtn = document.getElementById("fetch-btn");
    const status = document.getElementById("status");
    const bypassCache = document.getElementById("bypass-cache");
    const ignoreOg = document.getElementById("ignore-og");
    const templateSelect = document.getElementById("template");
    const layoutSelect = document.getElementById("layout");
    const tabs = document.querySelectorAll(".tab");
    let debounceTimer;
    let currentMode = "manual";
    let templatesData = [];

    // Load templates
    fetch("/generate-opengraph/templates")
      .then((r) => r.json())
      .then((data) => {
        templatesData = data;
        templateSelect.innerHTML = data
          .map((t) => `<option value="${t.id}">${t.id} (${t.domain})</option>`)
          .join("");
        updateLayouts();
      });

    templateSelect.addEventListener("change", () => {
      updateLayouts();
      updateImagesManual();
    });

    layoutSelect.addEventListener("change", () => {
      updateImagesManual();
    });

    function updateLayouts() {
      const tmpl = templatesData.find((t) => t.id === templateSelect.value);
      if (!tmpl) return;
      layoutSelect.innerHTML = tmpl.layouts
        .map((l) => `<option value="${l}">${l}</option>`)
        .join("");
    }

    // Tab switching
    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentMode = tab.dataset.mode;
        document.querySelectorAll(".mode").forEach(m => m.classList.remove("active"));
        document.getElementById(`mode-${currentMode}`).classList.add("active");
        if (currentMode === "manual") updateImagesManual();
      });
    });

    function loadImage(size, src) {
      return new Promise((resolve) => {
        const img = document.getElementById(`img-${size}`);
        const timeEl = document.getElementById(`time-${size}`);
        const start = performance.now();
        timeEl.textContent = "loading...";
        img.onload = () => {
          timeEl.textContent = `${Math.round(performance.now() - start)}ms`;
          resolve();
        };
        img.onerror = () => {
          timeEl.textContent = "failed";
          resolve();
        };
        img.src = src + (bypassCache.checked ? `&t=${Date.now()}` : "");
      });
    }

    async function updateImagesManual() {
      const params = new URLSearchParams({
        title: titleInput.value,
        subtitle: subtitleInput.value,
        category: categoryInput.value,
        author: authorInput.value,
        templateId: templateSelect.value,
        layout: layoutSelect.value,
      });
      for (const size of ["og", "portrait", "square"]) {
        await loadImage(size, `/generate?${params}&size=${size}`);
      }
    }

    async function updateImagesFromUrl(targetUrl) {
      const encoded = encodeURIComponent(targetUrl);
      const endpoints = {
        og: `/opengraph?url=${encoded}`,
        portrait: `/social/1080/1350?url=${encoded}`,
        square: `/social/1080/1080?url=${encoded}`,
      };
      for (const size of ["og", "portrait", "square"]) {
        await loadImage(size, endpoints[size]);
      }
    }

    titleInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updateImagesManual, 300);
    });
    subtitleInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updateImagesManual, 300);
    });
    categoryInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updateImagesManual, 300);
    });
    authorInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updateImagesManual, 300);
    });

    const debugPanel = document.getElementById("debug-panel");
    const debugSteps = document.getElementById("debug-steps");
    const debugResult = document.getElementById("debug-result");

    async function fetchDebug(targetUrl) {
      debugPanel.classList.remove("visible");
      try {
        const res = await fetch(`/generate-opengraph/debug?url=${encodeURIComponent(targetUrl)}`);
        const data = await res.json();

        debugSteps.innerHTML = data.steps
          .map((s, i) => `<li><span class="step-num">${i + 1}.</span>${s}</li>`)
          .join("");

        debugResult.innerHTML = `
          <dl>
            <dt>Template</dt><dd>${data.matchedTemplate || "—"}</dd>
          </dl>
          <dl>
            <dt>Layout</dt><dd>${data.matchedLayout || "—"}</dd>
          </dl>
          <dl>
            <dt>Final URL</dt><dd>${data.finalUrl || "—"}</dd>
          </dl>
        `;

        debugPanel.classList.add("visible");
      } catch {
        // silently skip debug if it fails
      }
    }

    fetchBtn.addEventListener("click", () => {
      const url = urlInput.value.trim();
      if (!url) return;
      fetchDebug(url);
      updateImagesFromUrl(url);
    });

    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") fetchBtn.click();
    });

    updateImagesManual();
  </script>
</body>
</html>
